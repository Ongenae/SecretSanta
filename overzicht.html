<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Alle lijstjes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Nunito:wght@400;600;700;800&family=Roboto+Slab:wght@300&display=swap" rel="stylesheet">
<style>
:root {
  --red: #dc3035; --red-b: #ed4044; --red-tint: #fff3f3; --red-ink: #c4252a;
  --blue: #2671b5; --blue-tint: #edf5ff; --blue-ink: #245fa6;
  --ink: #2d2d2c; --body: #4a4a4a; --muted: #6b6b6b; --line: #e3ecf7; --field-line: #cfdcec;
  --ok-bg: #e6f6ea; --err-bg: #fff3f3; --wa: #128a43; --focus: #2671b5; --gold: #f9a948;
}
* { box-sizing: border-box; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
body {
  margin: 0; min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column;
  background: #fff; color: var(--body);
  font: 400 16px/1.5 "Nunito", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
.hero {
  position: relative; overflow: hidden;
  background: linear-gradient(180deg, #5b9fdd 0%, #2d78bd 55%, #2671b5 100%);
}
.hero-top {
  color: #fff; text-align: center;
  padding: calc(env(safe-area-inset-top, 0px) + 26px) 16px 0;
}
h1 { margin: 0; line-height: 1; }
.t-light {
  display: block; font: 300 clamp(1.6rem, 7vw, 2.3rem)/1.1 "Roboto Slab", Georgia, serif; letter-spacing: .02em;
  text-shadow: 0 1px 8px rgba(15, 60, 120, .55);
}
.t-heavy {
  display: block; font: 400 clamp(2.1rem, 10.5vw, 3.4rem)/1.05 "Alfa Slab One", "Rockwell Extra Bold", Rockwell, Georgia, serif;
  text-shadow: 0 3px 0 rgba(20, 70, 130, .6), 0 2px 12px rgba(15, 60, 120, .35); overflow-wrap: anywhere;
}
.t-heavy.long { font-size: clamp(1.7rem, 8.4vw, 2.8rem); }
.scene { position: relative; max-width: 520px; margin: 0 auto; }
.gifts { display: block; width: 100%; height: auto; }
.snow { position: absolute; left: 50%; bottom: -1px; width: 100vw; height: 40px; transform: translateX(-50%); display: block; }
.intro { color: var(--muted); margin: 6px 0 0; text-align: center; text-wrap: balance; }
.wrap { flex: 1 0 auto; width: 100%; max-width: 640px; margin: 0 auto; padding: 0 16px 40px; }
.card {
  background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 18px; margin-top: 16px;
  box-shadow: 0 2px 12px rgba(38, 113, 181, .07);
}
h2 { font: 800 1.15rem/1.25 "Nunito", system-ui, sans-serif; color: var(--ink); margin: 0 0 4px; }
.hint { color: var(--muted); font-size: .9rem; margin: 0 0 12px; }
label { display: block; font-weight: 700; font-size: .85rem; color: var(--body); margin: 14px 0 4px; }
input, select, textarea {
  width: 100%; font: inherit; color: var(--ink); background: #fff;
  border: 1px solid var(--field-line); border-radius: 10px; padding: 10px 12px; min-height: 46px;
}
input::placeholder, textarea::placeholder { color: #8a94a0; }
textarea { min-height: 72px; resize: vertical; }
input:focus, select:focus, textarea:focus { border-color: var(--blue); }
input:focus-visible, select:focus-visible, textarea:focus-visible, button:focus-visible, a:focus-visible, summary:focus-visible {
  outline: 3px solid var(--focus); outline-offset: 2px;
}
button, .btn {
  font: inherit; font-weight: 800; border: 0; border-radius: 10px; padding: 10px 20px; min-height: 48px;
  cursor: pointer; background: var(--red); color: #fff; text-decoration: none;
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
}
.ghost { background: var(--blue-tint); color: var(--blue-ink); }
.wa { background: var(--wa); color: #fff; }
button:disabled { opacity: .5; cursor: not-allowed; }
.band {
  display: flex; justify-content: space-between; align-items: center; gap: 12px;
  padding: 10px 16px; font-size: .75rem; font-weight: 800; letter-spacing: .03em; text-transform: uppercase;
}
.card > .band { margin: 14px -18px 0; padding-left: 18px; padding-right: 18px; }
.band.blue { background: var(--blue-tint); color: var(--blue-ink); }
.band.red { background: var(--red-tint); color: var(--red-ink); }
.msg { border-radius: 10px; padding: 10px 12px; margin-top: 14px; font-size: .95rem; background: var(--blue-tint); color: var(--ink); }
.msg.err { background: var(--err-bg); }
.msg.ok { background: var(--ok-bg); }
.msg a { color: inherit; font-weight: 800; }
.toast {
  position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(20px + env(safe-area-inset-bottom, 0px));
  background: var(--ink); color: #fff; padding: 10px 16px; border-radius: 10px; z-index: 20;
  opacity: 0; pointer-events: none; transition: opacity .2s;
}
.toast.show { opacity: 1; }
@media (prefers-reduced-motion: reduce) { .toast { transition: none; } }

.wrap { max-width: 720px; }
.tools { display: flex; gap: 8px; margin-top: 16px; flex-wrap: wrap; }
.tools input { flex: 1 1 200px; }
.count { color: var(--muted); font-size: .9rem; margin: 14px 0 0; }
.grid { display: grid; gap: 14px; margin-top: 12px; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
.person { background: #fff; border: 1px solid var(--line); border-radius: 14px; overflow: hidden; box-shadow: 0 2px 12px rgba(38,113,181,.07); }
.person h2 { font-size: 1.1rem; margin: 0; padding: 14px 16px 12px; overflow-wrap: anywhere; }
.person ol { margin: 0; padding: 12px 16px 14px 38px; }
.person li { margin: 4px 0; overflow-wrap: anywhere; }
.person a { color: var(--blue-ink); font-weight: 800; }
.note { margin: 0; padding: 12px 16px 14px; border-top: 1px solid var(--line); color: var(--muted); font-size: .92rem; overflow-wrap: anywhere; }
</style>
</head>

<div class="wrap">
  <p class="intro">Hier vind je wat iedereen graag zou krijgen.</p>

  <div class="tools">
    <input id="q" type="search" placeholder="Zoek op naam" aria-label="Zoek op naam">
    <button id="refresh" class="ghost" type="button">Vernieuwen</button>
    <a class="btn primary" href="verlanglijstje.html">Mijn lijstje invullen</a>
  </div>
  <p class="count" id="count" aria-live="polite"></p>
  <div id="status"></div>
  <div class="grid" id="grid"></div>
</div>

<script src="config.js"></script>
<script>
(function () {
  function $(id) { return document.getElementById(id); }
  var CFG = window.SANTA_CONFIG || {};
  var ready = !!(CFG.SUPABASE_URL && CFG.SUPABASE_KEY &&
    CFG.SUPABASE_URL.indexOf("JOUW") === -1 && CFG.SUPABASE_KEY.indexOf("JOUW") === -1);
  var rows = [];

  function headers() {
    var h = { "apikey": CFG.SUPABASE_KEY };
    if (CFG.SUPABASE_KEY.indexOf("eyJ") === 0) h["Authorization"] = "Bearer " + CFG.SUPABASE_KEY;
    return h;
  }

  function msg(text, err) {
    var s = $("status");
    s.innerHTML = "";
    if (!text) return;
    var d = document.createElement("div");
    d.className = "msg" + (err ? " err" : "");
    d.textContent = text;
    s.appendChild(d);
  }

  function addText(parent, text) {
    // Maak webadressen aanklikbaar zonder HTML in te voegen
    var parts = String(text).split(/(https?:\/\/[^\s]+)/g);
    parts.forEach(function (p) {
      if (/^https?:\/\//.test(p)) {
        var a = document.createElement("a");
        a.href = p; a.target = "_blank"; a.rel = "noopener noreferrer"; a.textContent = p;
        parent.appendChild(a);
      } else if (p) {
        parent.appendChild(document.createTextNode(p));
      }
    });
  }

  function render() {
    var q = $("q").value.trim().toLowerCase();
    var list = rows.filter(function (r) { return !q || String(r.name).toLowerCase().indexOf(q) !== -1; });
    var grid = $("grid");
    grid.innerHTML = "";
    list.forEach(function (r) {
      var card = document.createElement("article");
      card.className = "person";
      var h = document.createElement("h2"); h.textContent = r.name; card.appendChild(h);
      var cnt = (r.items || []).length;
      var band = document.createElement("div"); band.className = "band blue";
      var s1 = document.createElement("span"); s1.textContent = cnt + (cnt === 1 ? " wens" : " wensen");
      var s2 = document.createElement("span");
      try { if (r.updated_at) s2.textContent = new Date(r.updated_at).toLocaleDateString("nl-BE", { day: "numeric", month: "short" }); } catch (e) {}
      band.appendChild(s1); band.appendChild(s2); card.appendChild(band);
      var ol = document.createElement("ol");
      (r.items || []).slice(0, 5).forEach(function (t) {
        var li = document.createElement("li"); addText(li, t); ol.appendChild(li);
      });
      card.appendChild(ol);
      if (r.note) {
        var n = document.createElement("p"); n.className = "note";
        n.appendChild(document.createTextNode("Handig om te weten: "));
        addText(n, r.note); card.appendChild(n);
      }
      grid.appendChild(card);
    });
    $("count").textContent = rows.length
      ? list.length + " van " + rows.length + (rows.length === 1 ? " lijstje" : " lijstjes")
      : "";
    if (!rows.length && ready && !$("status").firstChild) msg("Er zijn nog geen lijstjes. Wees de eerste en vul je lijstje in.", false);
  }

  function load() {
    if (!ready) {
      msg("De pagina is nog niet gekoppeld aan een database. Vul de gegevens in het bestand config.js in.", true);
      return;
    }
    msg("Lijstjes laden…", false);
    fetch(CFG.SUPABASE_URL.replace(/\/+$/, "") + "/rest/v1/wishes?select=name,items,note,updated_at&order=name.asc", { headers: headers() })
      .then(function (r) {
        if (!r.ok) throw new Error("Fout " + r.status);
        return r.json();
      })
      .then(function (data) { rows = data || []; msg("", false); render(); })
      .catch(function (e) { msg("De lijstjes konden niet geladen worden. Probeer het later opnieuw. (" + e.message + ")", true); });
  }

  $("q").addEventListener("input", render);
  $("refresh").onclick = load;
  load();
})();
</script>
</body>
</html>
